name: Submit branch

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: shiori-submit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    if: github.actor == github.repository_owner
    name: Create and merge pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Create or find the pull request
        id: pull_request
        shell: bash
        run: |
          set -Eeuo pipefail
          pull_request_number="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')"

          if [ -z "$pull_request_number" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH" \
              --body "Created automatically after a push to \`$BRANCH\`."
            pull_request_number="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi

          test -n "$pull_request_number"

          echo "number=$pull_request_number" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge
        shell: bash
        run: gh pr merge "${{ steps.pull_request.outputs.number }}" --auto --merge
